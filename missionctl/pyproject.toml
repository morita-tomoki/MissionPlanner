[project]
name = "missionctl"
version = "0.0.1"
description = "Multi-vehicle command & control core (Python + Qt Quick/QML) — a ground-up rewrite of MissionPlanner's C2 layer."
requires-python = ">=3.11"
readme = "README.md"

# Runtime dependencies are split so the *core* stays installable and testable
# without Qt. The GUI extras are only needed to run the app, never to test core/.
dependencies = [
    "pymavlink>=2.4.41",   # used as a CODEC ONLY (no I/O) — see ADR-0004
    "pyserial-asyncio>=0.6",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",        # Qt Quick / QML. Imported ONLY under src/missionctl/qt/
    "qasync>=0.27",        # unifies the asyncio + Qt event loops
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyright>=1.1.360",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/missionctl"]

# ---------------------------------------------------------------------------
# Tooling config — all of `make check` reads from here.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, async-specific checks.
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# ASYNC109: flags `timeout` parameters on async functions. Our protocol API
# deliberately takes explicit per-operation timeouts (arm/set_mode/request);
# the timeout is applied internally with `asyncio.timeout`. Intentional design.
ignore = ["ASYNC109"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# The Qt bridge legitimately touches dynamically-typed PySide6 APIs.
[[tool.pyright.executionEnvironments]]
root = "src/missionctl/qt"
reportUnknownMemberType = "none"
reportMissingTypeStubs = "none"

# The codec is the one place that touches untyped pymavlink. Relaxing unknown-type
# reporting is confined to this boundary module; its public API stays fully typed
# (MavlinkMessage), so the rest of the strict core is unaffected. See ADR-0004.
[[tool.pyright.executionEnvironments]]
root = "src/missionctl/core/codec"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportMissingTypeStubs = "none"
